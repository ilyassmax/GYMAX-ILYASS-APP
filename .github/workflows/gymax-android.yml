name: GYMAX Android APK
on:
  workflow_dispatch:
  push:
    branches: ['branding/gymax-ilyass']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
        working-directory: frontend
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0d0f10' --splashBackgroundColor '#0d0f10'
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build:mobile
        working-directory: frontend
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: frontend/android
      - run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk GYMAX-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GYMAX-Android
          path: GYMAX-Android.apk
          if-no-files-found: error

